[project]
name = "slm-forge"
version = "0.2.0"
description = "Local-first SLM fine-tuning lab driven by Hermes Agent and Karpathy-style autoresearch"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Amit Sahu" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "huey>=2.5",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # Phase L — observability. python-json-logger is kept as a runtime
    # safety net even though packages/_logging.py uses a stdlib JsonFormatter,
    # so downstream consumers can swap formatters without code changes.
    "python-json-logger>=2.0",
    "prometheus-client>=0.20",
    "tenacity>=8.2",
    # Phase D — Apache Ozone S3 gateway client. aioboto3 powers
    # OzoneObjectStore's streaming put/get; the sync boto3 covers
    # scripts/ozone_bootstrap.py and any synchronous admin work.
    "aioboto3>=13.0",
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "types-pyyaml>=6.0",
]

[project.optional-dependencies]
trainer = [
    # Phase P floor: gemma3 / gemma3n / gemma4 / mistral3 model architectures
    # ship in these releases (verified against mlx-lm 0.31.3, latest 2026-06).
    # Phase T: MLX ships no Linux/Windows wheels, so it is marker-gated to
    # Apple Silicon. `uv sync --all-extras` then resolves cleanly on Linux
    # (MLX simply skipped) while Macs still get the full MLX stack.
    "mlx>=0.31.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "transformers>=4.46",
    "datasets>=3.1",
    "huggingface-hub>=0.26",
    "safetensors>=0.4",
]
exporter = [
    "torch>=2.0",
    "gguf>=0.6",
    "sentencepiece>=0.2",
]
# Phase Q — CUDA training backend. Linux + NVIDIA only (bitsandbytes has no
# Metal support). Phase T: bitsandbytes is marker-gated to Linux so the group
# is safe under `uv sync --all-extras` on macOS (bitsandbytes is skipped; the
# remaining packages are harmless and the cuda backend stays inert on a Mac).
trainer-cuda = [
    "torch>=2.4",
    "transformers>=4.46",
    "peft>=0.13",
    "trl>=0.12",
    "bitsandbytes>=0.44; sys_platform == 'linux'",
    "datasets>=3.1",
    "accelerate>=1.0",
]
ingest = [
    "playwright>=1.48",
    "beautifulsoup4>=4.12",
    "boto3>=1.35",
    "requests>=2.32",
    "trafilatura>=1.12",
]
chat = [
    "langgraph>=0.2.50",
    "langchain-core>=0.3.20",
    "langchain-ollama>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.1",
]
research = [
    # Free web grounding for the R&D engine. SerpAPI / Tavily can be used
    # without installing this extra by setting SERPAPI_KEY / TAVILY_API_KEY.
    "ddgs>=8.0",
]
mcp = [
    # Model Context Protocol server. Exposes SLM-Forge capabilities to
    # Claude Desktop / Cursor / Claude Code CLI as MCP tools.
    "mcp>=1.0",
]
auth = [
    # Phase M — JWT verification against Keycloak's JWKS. python-jose is the
    # cleaner of the two options (PyJWT + cryptography also works) because
    # its `jwt.decode` accepts the JWK dict directly without a separate
    # key-construction step.
    "python-jose[cryptography]>=3.3",
]
error-responder = [
    "claude-agent-sdk>=0.2.106",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
