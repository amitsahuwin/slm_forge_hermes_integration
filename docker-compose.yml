services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: slm-forge-api
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - ./data:/app/data
      # ./runs is read-write so the API can write its own _api.log alongside
      # the worker logs (ratchet/trainer/exporter) that the dashboard tails.
      - ./runs:/app/runs
      - ./exports:/app/exports:ro
      # Hermes skills directory — read-only is fine, the API only enumerates.
      - ./.hermes-skills:/app/.hermes-skills:ro
      # docs/ is RW so the R&D tab can persist generated market-research reports.
      - ./docs:/app/docs
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - SLM_FORGE_DB_URL=sqlite:////app/data/slm_forge.db
      # Ollama runs on the host (Mac), not inside this container, so the API
      # has to reach it via host.docker.internal — `localhost` here would mean
      # the container itself.
      - OLLAMA_URL=http://host.docker.internal:11434
      # Phase M — auth/policy stack. Default OFF so local dev is unchanged.
      # Flip SLM_FORGE_AUTH_ENABLED to "true" (and bring up the `auth`
      # profile services) to enforce JWT + OPA decisions.
      - SLM_FORGE_AUTH_ENABLED=${SLM_FORGE_AUTH_ENABLED:-false}
      # Shared secret for host workers — must match the value the workers
      # see in .env. Empty string disables the bypass entirely (then
      # workers would need real JWTs, which they don't have).
      - SLM_FORGE_SERVICE_TOKEN=${SLM_FORGE_SERVICE_TOKEN:-}
      # KEYCLOAK_URL is for the API CONTAINER (Docker DNS).
      # KEYCLOAK_PUBLIC_URL is what /auth/config returns to the BROWSER
      # so it can redirect to login; the browser is on the host, so
      # `keycloak:8080` would never resolve there.
      - KEYCLOAK_URL=${KEYCLOAK_URL:-http://keycloak:8080}
      - KEYCLOAK_PUBLIC_URL=${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-slm-forge}
      - OPA_URL=${OPA_URL:-http://opa:8181}
      # Phase T — Platform detection for UI defaults (exported by Makefile).
      - SLM_FORGE_PLATFORM_OS=${SLM_FORGE_PLATFORM_OS:-}
      - SLM_FORGE_PLATFORM_ARCH=${SLM_FORGE_PLATFORM_ARCH:-}
      - SLM_FORGE_PLATFORM_HAS_NVIDIA=${SLM_FORGE_PLATFORM_HAS_NVIDIA:-false}
      # Error-responder / auto-fix loop — read at startup by the FastAPI
      # lifespan (fails fast on missing prod creds). For development mode the
      # LiteLLM proxy stands in for the Anthropic API so the SDK can reach
      # the host's local Ollama model. ``litellm`` resolves via the compose
      # network; host workers use ``http://localhost:4000`` instead (see .env).
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-development}
      - ERROR_REPORTER_ENABLED=${ERROR_REPORTER_ENABLED:-true}
      - AUTOFIX_ENABLED=${AUTOFIX_ENABLED:-false}
      - AUTOFIX_DEPLOY=${AUTOFIX_DEPLOY:-auto-commit-reload}
      - AUTOFIX_MODEL=${AUTOFIX_MODEL:-anthropic/claude-3-5-sonnet-20241022}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_REPO=${GITHUB_REPO:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL_API:-http://litellm:4000}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-sk-local-litellm-master}
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN:-sk-local-litellm-master}
      # Phase D — Ozone S3 storage backend.
      - SLM_FORGE_STORAGE=${SLM_FORGE_STORAGE:-s3}
      - SLM_FORGE_OZONE_S3_ENDPOINT=${SLM_FORGE_OZONE_S3_ENDPOINT:-http://host.docker.internal:9878}
      - SLM_FORGE_OZONE_ACCESS_KEY_ID=${SLM_FORGE_OZONE_ACCESS_KEY_ID:-}
      - SLM_FORGE_OZONE_SECRET_ACCESS_KEY=${SLM_FORGE_OZONE_SECRET_ACCESS_KEY:-}
    # `host-gateway` makes host.docker.internal resolve even on Linux hosts
    # (Docker Desktop on Mac maps it automatically, but this is harmless +
    # portable).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: slm-forge-web
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/public:/app/public
      - ./apps/web/index.html:/app/index.html
      - ./apps/web/tailwind.config.ts:/app/tailwind.config.ts
      - ./apps/web/postcss.config.js:/app/postcss.config.js
      - ./apps/web/vite.config.ts:/app/vite.config.ts
      - ./apps/web/tsconfig.json:/app/tsconfig.json
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - api
    restart: unless-stopped

  # Phase M — Keycloak identity provider. Opt-in via the `auth` profile so
  # default `docker compose up` skips it. Start with:
  #   docker compose --profile auth up -d keycloak opa
  # Then set SLM_FORGE_AUTH_ENABLED=true on the `api` service to actually
  # enforce. See docs/AUTH.md for the full operator workflow.
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: slm-forge-keycloak
    profiles: ["auth"]
    # The Keycloak image ENTRYPOINT is /opt/keycloak/bin/kc.sh, so we can't
    # inject shell here — anything we pass as `command` is parsed as kc.sh
    # arguments. The master-realm sslRequired tweak runs in the sidecar
    # `keycloak-init` service below.
    command: ["start-dev", "--import-realm"]
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
      # Force HTTP-only listener and disable hostname strictness so the
      # admin console works without a TLS reverse proxy.
      - KC_HTTP_ENABLED=true
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
      - KC_PROXY=edge
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    restart: unless-stopped

  # One-shot bootstrap: once Keycloak is up, use kcadm.sh to flip the master
  # realm's sslRequired flag to NONE. There's no env var or realm-export
  # equivalent for the master realm — it's auto-created at first boot — so
  # we have to talk to the admin API. Uses the same Keycloak image (kcadm.sh
  # is built in) with a `/bin/bash` entrypoint override.
  keycloak-init:
    image: quay.io/keycloak/keycloak:25.0
    container_name: slm-forge-keycloak-init
    profiles: ["auth"]
    depends_on:
      - keycloak
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "[keycloak-init] waiting for keycloak to come up…"
        for i in $$(seq 1 60); do
          if /opt/keycloak/bin/kcadm.sh config credentials \
               --server http://keycloak:8080 \
               --realm master --user admin --password admin >/dev/null 2>&1; then
            echo "[keycloak-init] connected on attempt $$i"
            break
          fi
          sleep 3
        done
        echo "[keycloak-init] disabling HTTPS requirement on master realm"
        /opt/keycloak/bin/kcadm.sh update realms/master -s sslRequired=NONE \
          && echo "[keycloak-init] ok — master sslRequired=NONE" \
          || echo "[keycloak-init] WARNING: could not update master realm"
    restart: "no"

  # Phase M — Open Policy Agent for authorization decisions. Hot-reloads
  # the rego files via --watch so policy edits land without a restart.
  # `latest` is the non-rootless OPA 1.x image that supports `import rego.v1`.
  # The `-rootless` flavor was deprecated and its older snapshots couldn't
  # parse the v1 keywords, so we explicitly use `latest`.
  opa:
    image: openpolicyagent/opa:latest
    container_name: slm-forge-opa
    profiles: ["auth"]
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--watch"
      - "/policies"
    ports:
      - "8181:8181"
    volumes:
      - ./policies:/policies:ro
    restart: unless-stopped

  # LiteLLM proxy — Anthropic-compatible front door over host Ollama. Used by
  # claude_agent_sdk in the auto-fix loop (DEPLOYMENT_MODE=development AND
  # AUTOFIX_ENABLED=true). Gated by the `autofix` profile so default
  # `make dev` doesn't pull a third image. Start with: `make litellm-up`.
  #
  # The proxy listens on :4000 — both the api container (intra-compose DNS
  # `litellm:4000`) and host workers (`localhost:4000`) can reach it. The
  # config maps `anthropic/claude-3-5-sonnet-20241022` and
  # `anthropic/qwen3-30b-a3b` aliases to host Ollama's `qwen3:30b-a3b` model.
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: slm-forge-litellm
    profiles: ["autofix"]
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-local-litellm-master}
    # host.docker.internal lets the proxy reach the host's Ollama on :11434
    # (Mac handles this automatically; the explicit mapping makes it portable
    # to Linux dev boxes too).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # MCP server — exposes SLM-Forge to Claude Desktop / Cursor / Claude Code.
  # Opt-in via the `mcp` profile so default `docker compose up` skips it.
  # Start with: docker compose --profile mcp up -d
  mcp:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    container_name: slm-forge-mcp
    profiles: ["mcp"]
    ports:
      - "8765:8765"
    environment:
      - SLM_FORGE_API_URL=http://slm-forge-api:8000
    depends_on:
      - api
    restart: unless-stopped
