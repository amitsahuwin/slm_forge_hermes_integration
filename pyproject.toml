[project]
name = "slm-forge"
version = "0.2.0"
description = "Local-first SLM fine-tuning lab driven by Hermes Agent and Karpathy-style autoresearch"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Amit Sahu" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "huey>=2.5",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "types-pyyaml>=6.0",
]

[project.optional-dependencies]
trainer = [
    "mlx>=0.20",
    "mlx-lm>=0.30",
    "transformers>=4.46",
    "datasets>=3.1",
    "huggingface-hub>=0.26",
    "safetensors>=0.4",
]
exporter = [
    "torch>=2.0",
    "gguf>=0.6",
    "sentencepiece>=0.2",
]
ingest = [
    "playwright>=1.48",
    "beautifulsoup4>=4.12",
    "boto3>=1.35",
    "requests>=2.32",
    "trafilatura>=1.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
